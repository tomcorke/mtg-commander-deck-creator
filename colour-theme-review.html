<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commander colour theme review</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #25243a; background: #f2f3fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 24px; border-bottom: 1px solid #dad8e6; background: #fff; }
    h1, h2, h3, p { margin-top: 0; }
    header p { margin-bottom: 0; color: #68667c; }
    .themes { display: grid; grid-template-columns: repeat(6, minmax(180px, 1fr)); min-width: 1080px; }
    .theme { --accent-text: var(--accent); --button-bg: var(--accent); padding: 22px 16px; border-right: 1px solid color-mix(in srgb, var(--highlight) 28%, #dad8e6); background: color-mix(in srgb, var(--accent) 6%, #f8f8ff); }
    .theme:last-child { border-right: 0; }
    .theme h2 { margin-bottom: 4px; color: var(--accent-text); font-size: 22px; }
    .theme > small { color: #68667c; }
    .sample { margin-top: 22px; padding-top: 16px; border-top: 1px solid color-mix(in srgb, var(--highlight) 35%, #dad8e6); }
    .sample h3 { color: var(--accent-text); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    button { padding: 9px 12px; border: 1px solid var(--button-bg); border-radius: 6px; background: var(--button-bg); color: contrast-color(var(--button-bg)); font: inherit; font-weight: 650; }
    .outline { background: transparent; color: var(--accent-text); }
    .tint { padding: 14px; border: 2px solid var(--accent); border-radius: 8px; background: color-mix(in srgb, var(--highlight) 20%, #f8f8ff); }
    .highlight { padding: 8px; border-radius: 5px; background: var(--highlight); color: contrast-color(var(--highlight)); }
    .muted { color: #68667c; }
    .bar { height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--accent), var(--highlight)); }
    .swatches { display: flex; gap: 8px; }
    .swatches i { width: 36px; height: 36px; border: 1px solid #0002; border-radius: 50%; background: var(--accent); }
    .swatches i + i { background: var(--highlight); }
    .dark { color-scheme: dark; border-top: 5px solid #090a0d; }
    .dark .theme { --accent-text: var(--highlight); --button-bg: color-mix(in srgb, var(--accent) 70%, #090b0f); background: color-mix(in srgb, var(--accent) 18%, #111419); color: #e5e3f0; }
    .dark .theme > small, .dark .muted { color: #c2c0d2; }
    .dark .tint { background: color-mix(in srgb, var(--accent) 28%, #111419); }
    .dark .highlight { background: color-mix(in srgb, var(--highlight) 28%, #111419); color: #f7f6fb; }
    .dark .outline { background: transparent; color: var(--accent-text); }
    @supports not (color: contrast-color(red)) { button { color: white; } .highlight { color: #19182d; } }
  </style>
</head>
<body>
  <header>
    <h1>Commander colour theme review</h1>
    <p>Current accent and highlight colours across light and dark surfaces. Button text uses CSS <code>contrast-color()</code>.</p>
  </header>
  <main id="preview"></main>
  <script>
    const colours = {
      White: ['#9b772e', '#f3df9b', '#765615'],
      Blue: ['#286da8', '#8dc9ee'],
      Black: ['#67506f', '#bf9ac8'],
      Red: ['#a83b32', '#ee8b68'],
      Green: ['#32734c', '#8bc795'],
      Colourless: ['#666879', '#b8bac7'],
    }
    const column = ([name, [accent, highlight, button = accent]]) => `<section class="theme" style="--accent:${accent};--highlight:${highlight};--button-bg:${button}">
      <h2>${name}</h2><small>${accent} / ${highlight}</small>
      <div class="sample"><h3>Actions</h3><button>Primary button</button> <button class="outline">Outline</button></div>
      <div class="sample"><h3>Tinted card</h3><div class="tint"><b>Selected card</b><p class="muted">Supporting text and metadata.</p></div></div>
      <div class="sample"><h3>Highlight</h3><p class="highlight">Highlighted status text</p></div>
      <div class="sample"><h3>Progress</h3><div class="bar"></div></div>
      <div class="sample"><h3>Palette</h3><div class="swatches"><i title="Accent"></i><i title="Highlight"></i></div></div>
    </section>`
    const columns = Object.entries(colours).map(column).join('')
    document.querySelector('#preview').innerHTML = `<div class="themes light">${columns}</div><div class="themes dark">${columns}</div>`
  </script>
</body>
</html>
